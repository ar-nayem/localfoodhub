<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#20693F">
  <title>You're offline — Foodivo</title>
  <!-- Self-contained on purpose: this is served when there's no network, so it can't
       depend on the app's CSS or JS bundles, which won't be reachable. -->
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
      background: #FAF8F4;
      color: #1a2521;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    .mark {
      width: 56px;
      height: 56px;
      margin: 0 auto 20px;
      border-radius: 14px;
      background: #20693F;
      color: #fff;
      font-size: 26px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { font-size: 15px; line-height: 1.5; color: #5b6b64; margin: 0 auto 24px; max-width: 30ch; }
    button {
      font: inherit;
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      background: #20693F;
      border: 0;
      border-radius: 999px;
      padding: 12px 28px;
      cursor: pointer;
    }
    button:focus-visible { outline: 3px solid #20693F; outline-offset: 3px; }
    @media (prefers-color-scheme: dark) {
      body { background: #101614; color: #e6ede9; }
      p { color: #9aaaa3; }
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">F</div>
    <h1>You're offline</h1>
    <p>Check your connection and try again. Your cart is saved on this device.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
